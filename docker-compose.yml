services:
  frontend:
    image: ghcr.io/juliyasg/film-frontend:latest
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/dist
    command: sh -c "cp -r /app/dist/* /dist && tail -f /dev/null"

  backend:
    image: ghcr.io/juliyasg/film-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  nginx:
    image: ghcr.io/juliyasg/film-nginx:latest
    build:
      context: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      - frontend
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: film_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: film_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  frontend_dist:
  postgres_data:
  pgadmin_data: